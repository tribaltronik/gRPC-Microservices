services:
  vault:
    image: hashicorp/vault:1.15
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["8200:8200"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s

  vault-init:
    build:
      context: .
      dockerfile: Dockerfile.vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      PROJECT_DIR: /
    volumes:
      - vault-tokens:/vault/tokens
    depends_on:
      vault:
        condition: service_healthy
      user-db:
        condition: service_healthy
      order-db:
        condition: service_healthy
    networks: [backend]

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports: ["5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    volumes:
      - user-db-data:/var/lib/postgresql/data

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports: ["5433:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    volumes:
      - order-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    ports: ["50051:50051"]
    environment:
      PORT: "50051"
      LOG_LEVEL: debug
      TLS_CERT_FILE: /certs/user-service/cert.pem
      TLS_KEY_FILE: /certs/user-service/key.pem
      TLS_CA_FILE: /certs/ca/ca.pem
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/tokens/user-service.token
      VAULT_DB_ROLE: user-service
    volumes:
      - ./certs:/certs:ro
      - vault-tokens:/vault/tokens:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order-service
    ports: ["50052:50052"]
    environment:
      PORT: "50052"
      LOG_LEVEL: debug
      USER_SERVICE_ADDR: user-service:50051
      REDIS_URL: redis://redis:6379/0
      TLS_CERT_FILE: /certs/order-service/cert.pem
      TLS_KEY_FILE: /certs/order-service/key.pem
      TLS_CA_FILE: /certs/ca/ca.pem
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/tokens/order-service.token
      VAULT_DB_ROLE: order-service
    volumes:
      - ./certs:/certs:ro
      - vault-tokens:/vault/tokens:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"

  ext-authz:
    build:
      context: .
      dockerfile: envoy/ext_authz/Dockerfile
    ports: ["50053:50053"]
    environment:
      PORT: "50053"
      API_KEY: grpc-poc-api-key-2026
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"

  envoy:
    build:
      context: ./envoy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./certs:/etc/envoy/certs:ro
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      ext-authz:
        condition: service_started
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  user-db-data:
  order-db-data:
  vault-tokens:
