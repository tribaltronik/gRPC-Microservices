{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "grpc-services.labels" (dict "name" $name "version" $svc.version) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
