{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "grpc-services.labels" (dict "name" $name "version" $svc.version) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "grpc-services.selectorLabels" (dict "name" $name "version" $svc.version) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grpc-services.selectorLabels" (dict "name" $name "version" $svc.version) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.metricsPort }}"
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image }}:{{ $svc.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ $svc.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: grpc-services-config
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            - name: METRICS_PORT
              value: "{{ $svc.metricsPort }}"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgresql:5432/{{ $name | replace "-service" "" }}s?sslmode=disable"
            - name: TLS_CERT_FILE
              value: /etc/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/tls.key
            - name: TLS_CA_FILE
              value: /etc/tls/ca.crt
            {{- if $svc.redisAddr }}
            - name: REDIS_URL
              value: "redis://{{ $svc.redisAddr }}/0"
            {{- end }}
            {{- if $svc.userSvcAddr }}
            - name: USER_SERVICE_ADDR
              value: "{{ $svc.userSvcAddr }}"
            {{- end }}
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls
          secret:
            secretName: {{ $svc.certSecret }}
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $name }}
                topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}
