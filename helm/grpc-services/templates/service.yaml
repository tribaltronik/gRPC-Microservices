{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "grpc-services.labels" (dict "name" $name "version" $svc.version) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "grpc-services.selectorLabels" (dict "name" $name "version" $svc.version) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $svc.port }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ $svc.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- end }}
