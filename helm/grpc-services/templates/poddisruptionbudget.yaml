{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "grpc-services.labels" (dict "name" $name "version" $svc.version) | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdbMinAvailable }}
  selector:
    matchLabels:
      {{- include "grpc-services.selectorLabels" (dict "name" $name "version" $svc.version) | nindent 6 }}
{{- end }}
{{- end }}
