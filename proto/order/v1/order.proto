syntax = "proto3";

package order.v1;

option go_package = "order/v1;orderv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

import "common/v1/common.proto";

// Status of an order
enum OrderStatus {
  // Default unspecified value
  ORDER_STATUS_UNSPECIFIED = 0;
  // Order has been created but not yet processed
  ORDER_STATUS_PENDING = 1;
  // Order has been confirmed
  ORDER_STATUS_CONFIRMED = 2;
  // Order has been shipped
  ORDER_STATUS_SHIPPED = 3;
  // Order has been delivered
  ORDER_STATUS_DELIVERED = 4;
  // Order was cancelled
  ORDER_STATUS_CANCELLED = 5;
}

// A single item in an order
message OrderItem {
  // Product identifier
  string product_id = 1;
  // Product name at time of ordering (denormalized)
  string product_name = 2;
  // Quantity ordered
  int32 quantity = 3;
  // Unit price in the same currency as the order total
  double unit_price = 4;
}

// Order resource
message Order {
  // Unique identifier (UUID v4)
  string id = 1;
  // ID of the user who placed the order
  string user_id = 2;
  // Items in the order
  repeated OrderItem items = 3;
  // Total amount (sum of all item quantities * unit_prices)
  double total = 4;
  // Current status of the order
  OrderStatus status = 5;
  // Timestamp when the order was placed
  google.protobuf.Timestamp created_at = 6;
}

// Request to create a new order
message CreateOrderRequest {
  // ID of the user placing the order
  string user_id = 1;
  // Items to order
  repeated OrderItem items = 2;
}

// Response after creating an order
message CreateOrderResponse {
  // The created order
  Order order = 1;
}

// Request to get an order by ID
message GetOrderRequest {
  // UUID of the order
  string id = 1;
}

// Response containing the requested order
message GetOrderResponse {
  // The requested order
  Order order = 1;
}

// Request to list orders, with pagination
message ListOrdersRequest {
  // Filter by user ID (optional)
  string user_id = 1;
  // Pagination parameters
  common.v1.Pagination pagination = 2;
}

// Response containing a list of orders
message ListOrdersResponse {
  // List of orders for the current page
  repeated Order orders = 1;
  // Pagination metadata
  common.v1.PaginationResponse pagination = 2;
}

// Request to cancel an order
message CancelOrderRequest {
  // UUID of the order to cancel
  string id = 1;
}

// Response after cancelling an order
message CancelOrderResponse {
  // The cancelled order
  Order order = 1;
}

// Order service with CRD + List operations
service OrderService {
  // Create a new order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/orders"
      body: "*"
    };
  }

  // Get an order by ID
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/api/v1/orders/{id}"
    };
  }

  // List orders with optional user filter and pagination
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/api/v1/orders"
    };
  }

  // Cancel an order (idempotent)
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/orders/{id}/cancel"
    };
  }
}
